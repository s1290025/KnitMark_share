      <div class="usage-button-step usage-button-step-reverse"><div class="usage-copy"><p data-ja="↶ ボタンを押すと、ひとつ前の状態に戻ります。" data-en="Tap ↶ to undo the last action.">↶ ボタンを押すと、ひとつ前の状態に戻ります。</p></div><div class="usage-counter-demo" data-demo-mode="undo" aria-label="Counter demonstration">

</div></div>

      <div class="usage-button-step"><div class="usage-counter-demo" data-demo-mode="marks" aria-label="Counter demonstration">
<div class="usage-demo-top"><button type="button" data-demo-action="undo" aria-label="Undo">↶</button></div>
<div class="usage-demo-history"><span data-ja="履歴" data-en="History">履歴</span><div data-demo-history></div></div>
<div class="usage-demo-count"><div class="usage-demo-value"><strong data-demo-value="row">0</strong><span data-ja="段" data-en="Rows">段</span><button class="usage-mark-button" data-demo-action="mark-row" aria-label="Mark rows">│→</button></div><button type="button" data-demo-action="row" aria-label="Add row">＋</button></div>
<div class="usage-demo-divider"></div><div class="usage-demo-count"><div class="usage-demo-value"><strong data-demo-value="stitch">0</strong><span data-ja="目" data-en="Stitches">目</span><button class="usage-mark-button" data-demo-action="mark-stitch" aria-label="Mark stitches">│→</button></div><button type="button" data-demo-action="stitch" aria-label="Add stitch">＋</button></div>
</div><div class="usage-copy"><p data-ja="│→を押すと、現在のカウントを履歴に残し、カウントをリセットできます。<br>目の│→は目数だけを、段の│→は段数と目数の両方を0に戻します。" data-en="Tap │→ to save the current count to history and reset the count.<br>The stitch │→ resets only the stitch count to zero, while the row │→ resets both the row and stitch counts to zero.">│→を押すと、現在のカウントを履歴に残し、カウントをリセットできます。<br>目の│→は目数だけを、段の│→は段数と目数の両方を0に戻します。</p></div></div>
      <div class="usage-button-step usage-button-step-reverse"><div class="usage-copy"><p data-ja="「途中を記録」で、カウントを変えずに編みかけの位置を履歴にメモできます。<br>編み進めると、途中の記録は通常の履歴にまとめられます。" data-en="Use Save Progress to note where you left off in the history without changing the count.<br>As you continue knitting, the saved progress is merged into the regular history.">「途中を記録」で、カウントを変えずに編みかけの位置を履歴にメモできます。<br>編み進めると、途中の記録は通常の履歴にまとめられます。</p></div><div class="usage-counter-demo" data-demo-mode="progress" aria-label="Counter demonstration">
<div class="usage-demo-top usage-progress-top"><button class="usage-progress-button" type="button" data-demo-action="progress" data-ja="途中を記録" data-en="Save Progress">途中を記録</button><button type="button" data-demo-action="undo" aria-label="Undo">↶</button></div>
<div class="usage-demo-history"><span data-ja="履歴" data-en="History">履歴</span><div data-demo-history></div></div>
<div class="usage-demo-count"><div class="usage-demo-value"><strong data-demo-value="row">0</strong><span data-ja="段" data-en="Rows">段</span></div><button type="button" data-demo-action="row" aria-label="Add row">＋</button></div>
<div class="usage-demo-divider"></div><div class="usage-demo-count"><div class="usage-demo-value"><strong data-demo-value="stitch">0</strong><span data-ja="目" data-en="Stitches">目</span></div><button type="button" data-demo-action="stitch" aria-label="Add stitch">＋</button></div>
</div></div>
