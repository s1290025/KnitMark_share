name: Copy Knit Mark icon

on:
  push:
    paths:
      - ".github/workflows/copy-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Copy app icon from KnitMark
        run: |
          mkdir -p assets
          curl -L --fail \
            "https://raw.githubusercontent.com/s1290025/KnitMark/main/assets/images/icon.png" \
            -o assets/icon.png
          file assets/icon.png
          test "$(wc -c < assets/icon.png)" -gt 1000000

      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png
          if git diff --cached --quiet; then
            echo "Icon is already up to date."
          else
            git commit -m "Use full Knit Mark app icon"
            git push
          fi
